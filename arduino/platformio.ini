[platformio]
src_dir = src
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
monitor_rts = 0
monitor_dtr = 0
; upload_port = COM3
upload_speed = 115200
upload_flags = -V
lib_deps =
    arduino-libraries/Servo@^1.2.1
monitor_filters = default, time
